name: Claude AI Workflow

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  claude-analysis:
  runs-on: ubuntu-latest
  if: contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@claude')

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Claude AI 回應
      uses: anthropics/claude-code-action@beta
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Claude AI 呼叫成功通知
      if: always()
      run: echo "✅ Claude 回應觸發成功！"
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        else
          echo "No package.json found, skipping npm install"
        fi
        
    - name: Run linter
      run: |
        if [ -f package.json ] && npm run lint --if-present; then
          echo "Linting completed"
        else
          echo "No linting script found or no package.json"
        fi
        
    - name: Run tests
      run: |
        if [ -f package.json ] && npm test --if-present; then
          echo "Tests completed"
        else
          echo "No test script found or no package.json"
        fi
        
    - name: Build project
      run: |
        if [ -f package.json ] && npm run build --if-present; then
          echo "Build completed"
        else
          echo "No build script found or no package.json"
        fi

  notify:
    runs-on: ubuntu-latest
    needs: [claude-analysis, build-and-test]
    if: always()
    
    steps:
    - name: Send notification
      run: |
        echo "Workflow completed"
        echo "Claude analysis status: ${{ needs.claude-analysis.result }}"
        echo "Build and test status: ${{ needs.build-and-test.result }}"